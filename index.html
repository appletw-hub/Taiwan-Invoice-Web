<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣發票 PDF 智慧解析與核對系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {

              'sand-light': '#F8F6F1', // 溫潤淺砂頁面底色
              'sand-border': '#E4DDD3',
              cactus: '#53713D',       // 仙人掌綠 PANTONE 18-0130 TCX
              'cactus-hover': '#455E32',

              robin: '#6C767D',        // 知更鳥灰藍 PANTONE 18-4015 TCX
              'robin-light': '#ECEEF0',
            }
          }
        }
      }
    };
  </script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<body class="bg-brand-sand-light text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // 國稅局扣抵代碼 (憑證格式只顯示編號)
    const VOUCHER_FORMATS = [
      { code: '21', label: '21', desc: '三聯式、電子計算機統一發票' },
      { code: '22I', label: '22I', desc: '二聯式收銀機統一發票、載有稅額憑證' },
      { code: '22Q', label: '22Q', desc: '載有稅額之其他(交通票根)憑證' },
      { code: '25', label: '25', desc: '三聯式收銀機統一發票及電子發票證明聯' },
      { code: '25G', label: '25G', desc: '公用事業憑證' },
      { code: '50', label: '50', desc: '勞務報酬單' },
      { code: '99', label: '99', desc: '其他收據與憑證' },
      { code: '收據', label: '收據', desc: '其他憑證(免用統一發票)' },
      { code: '車資單', label: '車資單', desc: '其他憑證(計程車乘車證明)' },
    ];

    function normalizeInvoice(inv) {
      if (!inv) return inv;
      let vf = String(inv.voucherFormat || '').trim();
      const validCodes = ['21', '22I', '22Q', '25', '25G', '50', '99', '收據', '車資單'];
      let matchedVf = validCodes.find(c => vf === c);
      if (!matchedVf) {
        if (vf.startsWith('22I')) matchedVf = '22I';
        else if (vf.startsWith('22Q')) matchedVf = '22Q';
        else if (vf.startsWith('22')) matchedVf = '22I';
        else if (vf.startsWith('25G')) matchedVf = '25G';
        else if (vf.startsWith('25')) matchedVf = '25';
        else if (vf.startsWith('21')) matchedVf = '21';
        else if (vf.startsWith('50')) matchedVf = '50';
        else if (vf.startsWith('99')) matchedVf = '99';
        else if (vf.includes('車資') || vf.includes('計程車')) matchedVf = '車資單';
        else if (vf.includes('收據')) matchedVf = '收據';
        else matchedVf = '25';
      }

      let pm = String(inv.paymentMonth || '').trim();
      const matchMonth = pm.match(/^(?:\d{4}[-/])?(\d{1,2})月?$/);
      if (matchMonth) {
        pm = matchMonth[1].padStart(2, '0');
      } else if (!pm && inv.invoiceDate) {
        const m = String(inv.invoiceDate).match(/^\d{4}[-/](\d{1,2})/);
        if (m) pm = m[1].padStart(2, '0');
      }

      return {
        ...inv,
        voucherFormat: matchedVf,
        paymentMonth: pm,
      };
    }

    // 稅別清單
    const TAX_TYPES = [
      { id: 'taxable', label: '應稅 (5%)', rate: 0.05 },
      { id: 'zero_rated', label: '零稅率 (0%)', rate: 0 },
      { id: 'exempt', label: '免稅', rate: 0 },
    ];

    // 12個核對欄位定義
    const INVOICE_COLUMNS = [
      { id: 'vendorName', label: '廠商名稱' },
      { id: 'taxId', label: '統一編號' },
      { id: 'paymentMonth', label: '貨款月份' },
      { id: 'voucherFormat', label: '憑證格式' },
      { id: 'invoiceDate', label: '發票日期' },
      { id: 'invoiceNumber', label: '發票號碼' },
      { id: 'salesAmount', label: '銷售額(未稅)', isNumber: true },
      { id: 'taxAmount', label: '稅額(5%)', isNumber: true },
      { id: 'totalAmount', label: '發票金額(含稅)', isNumber: true },
      { id: 'itemsDescription', label: '品項內容' },
      { id: 'settlementDate', label: '收付款日' },
      { id: 'remarks', label: '備註' },
    ];

    // 稅額計算器
    function calculateFromSales(salesAmount, taxType = 'taxable') {
      const sales = Math.max(0, parseInt(salesAmount, 10) || 0);
      if (taxType === 'zero_rated' || taxType === 'exempt') {
        return { salesAmount: sales, taxAmount: 0, totalAmount: sales };
      }
      const tax = Math.round(sales * 0.05);
      return { salesAmount: sales, taxAmount: tax, totalAmount: sales + tax };
    }

    function calculateFromTotal(totalAmount, taxType = 'taxable') {
      const total = Math.max(0, parseInt(totalAmount, 10) || 0);
      if (taxType === 'zero_rated' || taxType === 'exempt') {
        return { salesAmount: total, taxAmount: 0, totalAmount: total };
      }
      const sales = Math.round(total / 1.05);
      const tax = total - sales;
      return { salesAmount: sales, taxAmount: tax, totalAmount: total };
    }

    // Google Gemini API 發票解析
    async function parseInvoicesWithGemini(fileBase64, apiKey, model = 'gemini-3.8-flash', signal) {
      if (!apiKey) {
        throw new Error('請先在右上角設定您的 Google Gemini API Key');
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

      const prompt = `
你是一位精通台灣會計與稅務發票的專家。
這份 PDF 檔案內彙整了一張或多張發票或憑證（包含數位電子發票、掃描檔、紙本發票、收銀機發票、手機拍照圖片等）。

請逐頁、逐張辨識 PDF 內所有的發票資訊，並整理成 JSON 格式。
請嚴格遵守以下規則：
1. 一張發票請整理為一個物件（一行一張發票）。
2. 發票上的多個品項，請合併於 itemsDescription 欄位中（例如："文具組 x2; A4影印紙 x5"）。
3. 國稅局扣抵憑證格式代碼 (voucherFormat) 請嚴格依據發票類型判別，只填寫代碼編號（請勿附加額外中文文字）：
   - "21": 三聯式、電子計算機統一發票
   - "22I": 二聯式收銀機統一發票、載有稅額憑證
   - "22Q": 載有稅額之其他(交通票根，例如高鐵票、台鐵火車票、客運票等)憑證
   - "25": 三聯式收銀機統一發票及電子發票證明聯(有買方統編或電子發票證明聯)
   - "25G": 公用事業憑證(水費、電費、瓦斯費、公用事業電信繳費通知單)
   - "50": 勞務報酬單(個人勞務報酬扣繳憑單)
   - "99": 其他收據與憑證
   - "收據": 其他憑證(免用統一發票收據、小規模營業人收據)
   - "車資單": 其他憑證(計程車乘車證明、計程車收據車資單)
4. 稅別 (taxType)："taxable" (應稅 5%), "zero_rated" (零稅率), "exempt" (免稅)
5. 銷售額 (salesAmount, 未稅)、稅額 (taxAmount)、發票金額 (totalAmount, 含稅)。請輸出純整數。若為應稅且無稅額資訊，請以 5% 營業稅精確推算：
   - salesAmount = Math.round(totalAmount / 1.05)
   - taxAmount = totalAmount - salesAmount
6. 發票日期 (invoiceDate) 請統一轉換為西元格式 "YYYY-MM-DD"（例如 115/03/15 -> 2026-03-15）。
7. 貨款月份 (paymentMonth) 依發票日期產生月份，只填寫兩碼月份數字 "MM"（例如 "03"、"10"），請勿包含年份。
8. 廠商名稱 (vendorName) 與統一編號 (taxId)：提取賣方廠商名稱與 8 碼賣方統一編號。
9. 發票號碼 (invoiceNumber)：例如 "AB-12345678"。
10. 收付款日 (settlementDate) 與備註 (remarks)：若無請填空字串 ""。

請嚴格輸出符合以下 JSON Schema 的結構：
{
  "invoices": [
    {
      "vendorName": "廠商名稱",
      "taxId": "統一編號",
      "paymentMonth": "03",
      "voucherFormat": "25",
      "invoiceDate": "YYYY-MM-DD",
      "invoiceNumber": "AB-12345678",
      "taxType": "taxable",
      "salesAmount": 1000,
      "taxAmount": 50,
      "totalAmount": 1050,
      "itemsDescription": "品項明細",
      "settlementDate": "",
      "remarks": ""
    }
  ]
}
`;

      const response = await fetch(endpoint, {
        method: 'POST',
        signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inlineData: { mimeType: 'application/pdf', data: fileBase64 } },
              { text: prompt }
            ]
          }],
          generationConfig: {
            responseMimeType: 'application/json',
            temperature: 0.1
          }
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err?.error?.message || `API 呼叫失敗 (狀態碼 ${response.status})`);
      }

      const resData = await response.json();
      const rawText = resData?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error('模型未回傳文字內容');

      const parsed = JSON.parse(rawText);
      const list = Array.isArray(parsed) ? parsed : (parsed.invoices || []);
      return list.map(normalizeInvoice);
    }

    // 主應用元件
    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_invoice_key') || '');
      const VALID_MODELS = [
        'gemini-4-argon',
        'gemini-3.8-flash',
        'gemini-3.5-flash-lite',
        'gemini-3.1-pro-preview'
      ];
      const [model, setModel] = useState(() => {
        const m = localStorage.getItem('gemini_invoice_model');
        return (!m || !VALID_MODELS.includes(m)) ? 'gemini-3.8-flash' : m;
      });
      const [invoices, setInvoices] = useState(() => {
        try {
          const d = localStorage.getItem('invoice_table_draft');
          return d ? JSON.parse(d).map(normalizeInvoice) : [];
        } catch {
          return [];
        }
      });

      const [isProcessing, setIsProcessing] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const abortRef = useRef(null);
      const abortReasonRef = useRef('');
      const REQUEST_TIMEOUT_MS = 300000; // 300 秒 (5 分鐘) 逾時
      const MAX_FILE_MB = 15; // inline PDF 上限（base64 後約 20MB）

      useEffect(() => {
        if (!isProcessing) return;
        setElapsed(0);
        const t = setInterval(() => setElapsed(s => s + 1), 1000);
        return () => clearInterval(t);
      }, [isProcessing]);

      const cancelProcessing = (e) => {
        e?.preventDefault();
        e?.stopPropagation();
        abortReasonRef.current = 'user';
        abortRef.current?.abort();
      };
      const [isKeyModalOpen, setIsKeyModalOpen] = useState(false);
      const [isExportModalOpen, setIsExportModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // 批次欄位
      const [batchMonth, setBatchMonth] = useState('');
      const [batchDate, setBatchDate] = useState('');

      // 匯出勾選欄位與格式
      const [exportFormat, setExportFormat] = useState('xlsx'); // 'xlsx' | 'csv'
      const [selectedCols, setSelectedCols] = useState(INVOICE_COLUMNS.map(c => c.id));
      const [exportFileName, setExportFileName] = useState(`發票明細表_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}`);

      useEffect(() => {
        localStorage.setItem('invoice_table_draft', JSON.stringify(invoices));
      }, [invoices]);

      const notify = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleSaveKey = (key, mdl) => {
        setApiKey(key);
        setModel(mdl);
        localStorage.setItem('gemini_invoice_key', key);
        localStorage.setItem('gemini_invoice_model', mdl);
        setIsKeyModalOpen(false);
        notify('API Key 設定完成！');
      };

      // 處理上傳 PDF
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!apiKey) {
          setIsKeyModalOpen(true);
          return;
        }

        const inputEl = e.target;

        if (file.type !== 'application/pdf') {
          notify('請上傳 PDF 格式檔案', 'error');
          inputEl.value = '';
          return;
        }

        const sizeMB = file.size / 1024 / 1024;
        if (sizeMB > MAX_FILE_MB) {
          notify(`PDF 檔案 ${sizeMB.toFixed(1)}MB 超過 ${MAX_FILE_MB}MB 上限，請拆分或壓縮後再上傳`, 'error');
          inputEl.value = '';
          return;
        }

        const controller = new AbortController();
        abortRef.current = controller;
        abortReasonRef.current = '';
        const timeoutId = setTimeout(() => {
          abortReasonRef.current = 'timeout';
          controller.abort();
        }, REQUEST_TIMEOUT_MS);

        setIsProcessing(true);
        const t0 = performance.now();
        try {
          const reader = new FileReader();
          const base64 = await new Promise((resolve, reject) => {
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          console.info(`[Gemini] model=${model} size=${sizeMB.toFixed(2)}MB 送出請求`);
          const results = await parseInvoicesWithGemini(base64, apiKey, model, controller.signal);
          console.info(`[Gemini] 完成，耗時 ${((performance.now() - t0) / 1000).toFixed(1)}s，共 ${results.length} 筆`);
          if (results.length === 0) {
            notify('未在 PDF 中解析出發票，請確認內容是否清晰', 'error');
          } else {
            setInvoices(prev => [...prev, ...results]);
            notify(`成功辨識並匯入 ${results.length} 筆發票資料！`);
          }
        } catch (err) {
          console.error('[Gemini] 失敗：', err);
          if (err.name === 'AbortError') {
            notify(
              abortReasonRef.current === 'user'
                ? '已取消辨識'
                : `辨識逾時（超過 ${REQUEST_TIMEOUT_MS / 1000} 秒），請改用 gemini-3.8-flash / gemini-3.5-flash-lite 或拆分 PDF 後重試`,
              'error'
            );
          } else if (err instanceof TypeError) {
            notify('網路連線失敗，請確認網路或 API Key 是否正確', 'error');
          } else {
            notify(err.message || '解析失敗', 'error');
          }
        } finally {
          clearTimeout(timeoutId);
          abortRef.current = null;
          setIsProcessing(false);
          inputEl.value = '';
        }
      };

      // 表格即時修改與稅額連動
      const handleFieldChange = (index, field, value) => {
        const list = [...invoices];
        const row = { ...list[index] };
        const currentTaxType = row.taxType || 'taxable';

        if (field === 'taxType') {
          row.taxType = value;
          const res = calculateFromSales(row.salesAmount, value);
          row.taxAmount = res.taxAmount;
          row.totalAmount = res.totalAmount;
        } else if (field === 'salesAmount') {
          const res = calculateFromSales(value, currentTaxType);
          row.salesAmount = res.salesAmount;
          row.taxAmount = res.taxAmount;
          row.totalAmount = res.totalAmount;
        } else if (field === 'totalAmount') {
          const res = calculateFromTotal(value, currentTaxType);
          row.salesAmount = res.salesAmount;
          row.taxAmount = res.taxAmount;
          row.totalAmount = res.totalAmount;
        } else {
          row[field] = value;
        }

        list[index] = row;
        setInvoices(list);
      };

      // 批次套用
      const applyBatchMonth = () => {
        if (!batchMonth) return;
        const cleanMonth = batchMonth.replace(/^(?:\d{4}[-/])?(\d{1,2})月?$/, '$1').padStart(2, '0');
        setInvoices(invoices.map(inv => ({ ...inv, paymentMonth: cleanMonth })));
        notify(`已將所有筆數之貨款月份更新為 ${cleanMonth}`);
      };

      const applyBatchDate = () => {
        if (!batchDate) return;
        setInvoices(invoices.map(inv => ({ ...inv, settlementDate: batchDate })));
        notify(`已將所有筆數之收付款日更新為 ${batchDate}`);
      };

      const addEmptyRow = () => {
        const today = new Date().toISOString().slice(0, 10);
        setInvoices([{
          vendorName: '',
          taxId: '',
          paymentMonth: today.slice(5, 7),
          voucherFormat: '25',
          invoiceDate: today,
          invoiceNumber: '',
          taxType: 'taxable',
          salesAmount: 0,
          taxAmount: 0,
          totalAmount: 0,
          itemsDescription: '',
          settlementDate: '',
          remarks: ''
        }, ...invoices]);
      };

      const deleteRow = (idx) => {
        setInvoices(invoices.filter((_, i) => i !== idx));
        notify('已刪除該筆資料');
      };

      const clearAll = () => {
        if (confirm('確定清空所有發票資料？')) {
          setInvoices([]);
          notify('已清空所有發票清單');
        }
      };

      // 載入展示資料
      const loadDemo = () => {
        setInvoices([
          {
            vendorName: '遠東工程顧問有限公司',
            taxId: '23847591',
            paymentMonth: '09',
            voucherFormat: '25',
            invoiceDate: '2026-09-08',
            invoiceNumber: 'QD-18293041',
            taxType: 'taxable',
            salesAmount: 42000,
            taxAmount: 2100,
            totalAmount: 44100,
            itemsDescription: '9月份機房空調工程款與檢修費',
            settlementDate: '2026-09-30',
            remarks: '每月常態性支出'
          },
          {
            vendorName: '良友辦公文具有限公司',
            taxId: '84910283',
            paymentMonth: '09',
            voucherFormat: '21',
            invoiceDate: '2026-09-12',
            invoiceNumber: 'QD-20491823',
            taxType: 'taxable',
            salesAmount: 3800,
            taxAmount: 190,
            totalAmount: 3990,
            itemsDescription: 'A4影印紙 10箱; 黑色油性筆 2打',
            settlementDate: '2026-09-20',
            remarks: '辦公耗材'
          },
          {
            vendorName: '台東縣原住民生鮮農產產銷班',
            taxId: '91827364',
            paymentMonth: '09',
            voucherFormat: '22I',
            invoiceDate: '2026-09-15',
            invoiceNumber: 'QD-59381024',
            taxType: 'exempt',
            salesAmount: 6500,
            taxAmount: 0,
            totalAmount: 6500,
            itemsDescription: '秋節慰問客戶有機水果禮盒 x10',
            settlementDate: '2026-09-18',
            remarks: '未加工生鮮蔬果（免稅）'
          }
        ]);
        notify('已載入 3 筆發票測試範例！');
      };

      // 匯出 Excel 或 CSV
      const handleExport = () => {
        if (invoices.length === 0) {
          notify('目前沒有發票資料可供匯出', 'error');
          return;
        }

        const activeCols = INVOICE_COLUMNS.filter(c => selectedCols.includes(c.id));
        if (activeCols.length === 0) {
          notify('請至少勾選一個匯出欄位', 'error');
          return;
        }

        const exportData = invoices.map(inv => {
          const row = {};
          activeCols.forEach(col => {
            let val = inv[col.id] ?? '';
            if (col.isNumber) {
              val = parseInt(val, 10) || 0;
            }
            row[col.label] = val;
          });
          return row;
        });

        const baseFileName = exportFileName.replace(/\.(xlsx|csv)$/i, '');

        if (exportFormat === 'csv') {
          const ws = XLSX.utils.json_to_sheet(exportData);
          const csvText = XLSX.utils.sheet_to_csv(ws);

          const blob = new Blob(['\uFEFF' + csvText], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `${baseFileName}.csv`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          notify(`成功匯出 CSV 報表：${baseFileName}.csv`);
        } else {
          const ws = XLSX.utils.json_to_sheet(exportData);

            if (c.id === 'itemsDescription') return { wch: 32 };
            if (c.id === 'vendorName') return { wch: 25 };
            if (c.id === 'voucherFormat') return { wch: 15 };
            return { wch: 15 };
          });

                <div className="p-6 space-y-4">
                  <div className="bg-brand-sand/20 border border-brand-sand-border rounded-xl p-3 text-xs text-slate-700">
                    <strong>隱私安全承諾：</strong> 您的 API Key 僅保存在本機瀏覽器的 LocalStorage 中，解析發票時是由您的瀏覽器直接向 Google 官方 API 發送請求，伺服器不保存任何資料。
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-2">Google Gemini API Key</label>
                    <input
                      type="password"
                      id="keyInput"
                      defaultValue={apiKey}
                      placeholder="AIzaSy..."
                      className="w-full px-4 py-2.5 text-sm border border-brand-sand-border rounded-xl focus:ring-2 focus:ring-brand-navy focus:border-brand-navy font-mono"
                    />
                    <div className="mt-2 text-xs">
                      <a
                        href="https://aistudio.google.com/app/apikey"
                        target="_blank"
                        rel="noreferrer"
                        className="text-brand-navy hover:underline font-medium"
                      >
                        前往 Google AI Studio 免費申請 API Key →
                      </a>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-2">辨識模型</label>
                    <select
                      id="modelSelect"
                      defaultValue={model}
                      className="w-full px-3 py-2 text-sm border border-brand-sand-border rounded-xl focus:ring-2 focus:ring-brand-navy focus:border-brand-navy bg-white font-mono"
                    >
                      <option value="gemini-4-argon">gemini-4-argon</option>
                      <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                      <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                      <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
                    </select>
                  </div>
                </div>

                <div className="bg-[#F8F6F1] px-6 py-4 flex justify-end gap-3 border-t border-brand-sand-border">
                  <button
                    onClick={() => setIsKeyModalOpen(false)}
                    className="px-4 py-2 text-sm text-slate-600 hover:bg-brand-sand/30 rounded-xl font-medium"
                  >
                    取消
                  </button>
                  <button
                    onClick={() => {
                      const k = document.getElementById('keyInput').value.trim();
                      const m = document.getElementById('modelSelect').value;
                      handleSaveKey(k, m);
                    }}
                    className="px-5 py-2 text-sm bg-brand-navy hover:bg-brand-navy-hover text-white rounded-xl font-medium shadow-sm shadow-brand-navy/20"
                  >
                    儲存設定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Export Modal */}
          {isExportModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-brand-sand-border">
                <div className="bg-gradient-to-r from-brand-cactus to-[#3E552D] p-5 text-white flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-bold">自選核對項目匯出</h2>
                    <p className="text-emerald-100 text-xs">支援 EXCEL (.xlsx) 與 CSV (.csv) 格式</p>
                  </div>
                  <button onClick={() => setIsExportModalOpen(false)} className="text-white/80 hover:text-white text-lg">✕</button>
                </div>

                <div className="p-5 space-y-4">
                  {/* 匯出格式選擇 */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">匯出格式</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setExportFormat('xlsx')}
                        className={`py-2 px-3 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-2 ${
                          exportFormat === 'xlsx'
                            ? 'bg-brand-cactus text-white border-brand-cactus shadow-sm'
                            : 'bg-white text-slate-600 border-brand-sand-border hover:bg-[#F8F6F1]'
                        }`}
                      >
                        <span>📊 EXCEL (.xlsx)</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setExportFormat('csv')}
                        className={`py-2 px-3 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-2 ${
                          exportFormat === 'csv'
                            ? 'bg-brand-cactus text-white border-brand-cactus shadow-sm'
                            : 'bg-white text-slate-600 border-brand-sand-border hover:bg-[#F8F6F1]'
                        }`}
                      >
                        <span>📄 CSV (.csv)</span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">檔案名稱</label>
                    <div className="flex items-center">
                      <input
                        type="text"
                        value={exportFileName}
                        onChange={(e) => setExportFileName(e.target.value)}
                        className="w-full px-3 py-2 text-sm border border-brand-sand-border rounded-xl focus:ring-2 focus:ring-brand-cactus focus:border-brand-cactus"
                      />
                      <span className="ml-2 text-xs text-slate-400 font-mono">
                        {exportFormat === 'xlsx' ? '.xlsx' : '.csv'}
                      </span>
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-xs font-semibold text-slate-700">
                        核對欄位勾選 ({selectedCols.length}/{INVOICE_COLUMNS.length})
                      </label>
                      <div className="flex gap-2 text-xs">
                        <button
                          onClick={() => setSelectedCols(INVOICE_COLUMNS.map(c => c.id))}
                          className="text-brand-cactus hover:underline font-medium"
                        >
                          全選
                        </button>
                        <span className="text-slate-300">|</span>
                        <button
                          onClick={() => setSelectedCols([])}
                          className="text-slate-500 hover:underline font-medium"
                        >
                          全部取消
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-[#F8F6F1] p-3 rounded-xl border border-brand-sand-border max-h-56 overflow-y-auto">
                      {INVOICE_COLUMNS.map(col => {
                        const checked = selectedCols.includes(col.id);
                        return (
                          <button
                            key={col.id}
                            type="button"
                            onClick={() => {
                              setSelectedCols(checked ? selectedCols.filter(id => id !== col.id) : [...selectedCols, col.id]);
                            }}
                            className={`flex items-center gap-2 p-2 rounded-lg text-xs font-medium text-left transition ${
                              checked ? 'bg-brand-cactus/15 text-brand-cactus border border-brand-cactus/40' : 'bg-white text-slate-500 border border-brand-sand-border'
                            }`}
                          >
                            <span>{checked ? '☑' : '☐'}</span>
                            <span>{col.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="bg-[#F8F6F1] px-5 py-3.5 flex justify-end gap-2.5 border-t border-brand-sand-border">
                  <button
                    onClick={() => setIsExportModalOpen(false)}
                    className="px-4 py-2 text-xs text-slate-600 hover:bg-brand-sand/30 rounded-xl font-medium"
                  >
                    取消
                  </button>
                  <button
                    onClick={handleExport}
                    disabled={selectedCols.length === 0}
                    className="px-4 py-2 text-xs bg-brand-cactus hover:bg-brand-cactus-hover disabled:opacity-50 text-white rounded-xl font-semibold shadow-sm shadow-brand-cactus/20"
                  >
                    {exportFormat === 'xlsx' ? '下載 EXCEL 報表 (.xlsx)' : '下載 CSV 報表 (.csv)'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
